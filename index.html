<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DANIBOSS TV - Streaming</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    background: #050505;
    color: #e5e5e5;
    overflow-x: hidden;
  }

  /* CONTAINER DO PLAYER */
  .player-container {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto 20px auto;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    aspect-ratio: 16 / 9;
  }

  /* ESTADO FULLSCREEN PERSONALIZADO */
  .player-container.fullscreen {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    max-width: none; border-radius: 0; z-index: 9999;
  }

  #stage { width: 100%; height: 100%; position: relative; }

  /* MARCA D'ÁGUA (MOSCA) - SEMPRE NO TOPO */
  .watermark {
    position: absolute;
    top: 5%; right: 4%;
    z-index: 1000;
    opacity: 0.7;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: opacity 0.3s;
  }
  .watermark img { height: 45px; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.9)); }
  .live-dot {
    width: 12px; height: 12px; background: #ff0000;
    border-radius: 50%; box-shadow: 0 0 10px #ff0000;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0% {opacity:1;} 50% {opacity:0.2;} 100% {opacity:1;} }

  #player, #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #frame { display: none; }

  /* INTERFACE */
  .ui-content { max-width: 1100px; margin: 0 auto; }
  #info {
    background: #111; padding: 12px 20px; border-radius: 8px;
    font-family: monospace; border-left: 4px solid #3b82f6; margin-bottom: 15px;
  }
  .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  button {
    padding: 10px 20px; border: none; border-radius: 6px;
    cursor: pointer; font-weight: bold; background: #2563eb; color: #fff;
  }
  button:hover { background: #1d4ed8; }
  button.sec { background: #333; }
  
  .table-wrapper { background: #111; border-radius: 8px; overflow: hidden; border: 1px solid #222; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #1a1a1a; padding: 10px; text-align: left; }
  td { padding: 8px; border-top: 1px solid #222; }
  input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 4px; border-radius: 4px; width: 100%; }
  
  tr.active { background: #1e3a5f !important; border-left: 4px solid #3b82f6; }

  /* BOTÃO EXPANDIR */
  .expand-btn {
    position: absolute; bottom: 20px; right: 20px;
    z-index: 1001; background: rgba(0,0,0,0.5);
    padding: 5px 10px; border-radius: 4px; font-size: 11px;
    cursor: pointer; border: 1px solid #444; color: #fff;
  }
</style>
</head>
<body>

<div class="ui-content">
  <h2 style="margin-top:0">📺 DANIBOSS TV <span style="font-size:12px; font-weight:normal; opacity:0.5">Streaming Privado</span></h2>
</div>

<div class="player-container" id="mainContainer">
  <div id="stage">
    <div class="watermark">
      <div class="live-dot"></div>
      <img src="daniboss-tv-logo.png" alt="LOGO">
    </div>

    <div class="expand-btn" onclick="toggleFull()">TELA CHEIA (ESC para sair)</div>

    <video id="player" playsinline></video>
    <iframe id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<div class="ui-content">
  <div id="info">Sintonizando...</div>

  <div class="controls">
    <button id="playBtn">▶ INICIAR CANAL</button>
    <button class="sec" onclick="prevVideo()">⏮ Anterior</button>
    <button class="sec" onclick="nextVideo()">⏭ Próximo</button>
    <label style="font-size:13px; display:flex; align-items:center; gap:5px">
      <input type="checkbox" id="shuffleBtn" checked> Modo Shuffle (Sem Repetição)
    </label>
  </div>

  <div class="table-wrapper">
    <table id="playlistTable">
      <thead>
        <tr><th>#</th><th>URL do Vídeo</th><th style="width:80px">Início</th><th style="width:80px">Fim</th><th>Nota</th></tr>
      </thead>
      <tbody id="playlistBody"></tbody>
    </table>
  </div>
  <p style="font-size:11px; color:#666; margin-top:10px">Nota: YouTube/Instagram rodam via Iframe. Links .m3u8 rodam via HLS nativo.</p>
</div>

<script>
const player = document.getElementById('player');
const frame = document.getElementById('frame');
const info = document.getElementById('info');
const container = document.getElementById('mainContainer');

let videos = [], order = [], currentPos = 0, hls = null, isPlaying = false;

const INITIAL_DATA = [
  ['https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', '5', '30', 'Abertura HLS'],
  ['https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', '', '', 'Curta Metragem'],
  ['https://www.youtube.com/watch?v=KSNUugQuweY', '', '', 'Clipe YouTube'],
  ['https://www.youtube.com/shorts/eiB1zk97wNk', '', '60', 'Shorts Vertical']
];

function toggleFull() {
  container.classList.toggle('fullscreen');
}

document.addEventListener('keydown', (e) => {
  if (e.key === "Escape") container.classList.remove('fullscreen');
});

function buildPlaylist() {
  const rows = document.getElementById('playlistBody');
  rows.innerHTML = '';
  videos = INITIAL_DATA.map((v, i) => {
    rows.innerHTML += `<tr id="row-${i}"><td>${i+1}</td><td><input value="${v[0]}"></td><td><input value="${v[1]}"></td><td><input value="${v[2]}"></td><td><input value="${v[3]}"></td></tr>`;
    return { url: v[0], start: Number(v[1]), end: Number(v[2]), note: v[3] };
  });
  shuffle();
}

function shuffle() {
  order = videos.map((_, i) => i);
  if (document.getElementById('shuffleBtn').checked) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
}

async function playCurrent() {
  if (hls) { hls.destroy(); hls = null; }
  clearTimeout(window.ytTimer);
  
  const idx = order[currentPos];
  const video = videos[idx];
  const isYT = video.url.includes('youtube.com') || video.url.includes('youtu.be');

  document.querySelectorAll('tr').forEach(r => r.classList.remove('active'));
  document.getElementById(`row-${idx}`).classList.add('active');

  if (isYT) {
    const id = video.url.match(/(?:v=|shorts\/|be\/)([A-Za-z0-9_-]{11})/)[1];
    frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&controls=0&rel=0&start=${video.start || 0}`;
    frame.style.display = 'block'; player.style.display = 'none';
    info.innerText = `[TV] EM EXIBIÇÃO: ${video.note || 'YouTube'}`;
    // Simula fim do vídeo após 5 min ou tempo definido
    let time = video.end ? (video.end - video.start) : 300;
    window.ytTimer = setTimeout(nextVideo, time * 1000);
  } else {
    frame.style.display = 'none'; player.style.display = 'block';
    if (video.url.includes('.m3u8')) {
      if (Hls.isSupported()) {
        hls = new Hls(); hls.loadSource(video.url); hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { if(video.start) player.currentTime = video.start; player.play(); });
      }
    } else {
      player.src = video.url;
      player.onloadedmetadata = () => { if(video.start) player.currentTime = video.start; player.play(); };
    }
    info.innerText = `[TV] EM EXIBIÇÃO: ${video.note || 'MP4/HLS'}`;
  }
  isPlaying = true;
}

function nextVideo() {
  currentPos = (currentPos + 1) % order.length;
  if (currentPos === 0) shuffle(); // Re-embaralha ao fim do ciclo
  playCurrent();
}

function prevVideo() {
  currentPos = (currentPos - 1 + order.length) % order.length;
  playCurrent();
}

// GARANTIA DE CONTINUIDADE 24/7
player.addEventListener('ended', nextVideo);
player.addEventListener('error', () => setTimeout(nextVideo, 2000));

// Tenta manter o play se o navegador pausar sozinho
setInterval(() => {
  if (isPlaying && player.paused && frame.style.display === 'none') {
    player.play().catch(() => { player.muted = true; player.play(); });
  }
}, 5000);

document.getElementById('playBtn').onclick = () => {
  if (!isPlaying) { playCurrent(); document.getElementById('playBtn').innerText = "⏸ CANAL NO AR"; }
};

window.onload = buildPlaylist;
</script>

</body>
</html>
