<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>DANIBOSS TV - ADMIN MODE</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0; background: #050505; color: #e5e5e5;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .player-section { flex: 3; display: flex; flex-direction: column; background: #000; overflow-y: auto; }
        
        #stage { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; flex-shrink: 0; }
        #player, #frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .ui-footer { padding: 20px; background: #0a0a0a; border-top: 1px solid #222; }
        .btn-sound {
            padding: 12px 24px; background: #2563eb; color: white; border: none;
            border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* PAINEL ADMIN */
        #adminPanel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; padding: 25px; border-radius: 12px;
            z-index: 10000; display: none; width: 90%; max-width: 600px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 1px solid #333;
        }
        #adminPanel h2 { margin-top: 0; color: #3b82f6; }
        .admin-input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #444; color: white; }
        .video-list { max-height: 200px; overflow-y: auto; margin: 15px 0; border: 1px solid #333; padding: 10px; }
        .video-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #222; font-size: 12px; }
        .btn-del { color: #ff4444; cursor: pointer; }
        .btn-close { background: #444; color: white; padding: 8px; border: none; cursor: pointer; width: 100%; margin-top: 10px; }

        .prog-table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        .active-row { color: #3b82f6; font-weight: bold; background: rgba(59, 130, 246, 0.1); }
        
        .admin-trigger { position: fixed; bottom: 10px; right: 10px; opacity: 0.2; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="player-section">
        <div id="stage">
            <video id="player" playsinline muted></video>
            <iframe id="frame" allow="autoplay; encrypted-media; fullscreen"></iframe>
        </div>
        
        <div class="ui-footer">
            <div id="info" style="color: #22c55e; margin-bottom: 10px;">Sincronizando...</div>
            <button class="btn-sound" id="soundBtn" onclick="enableAudio()">🔊 ATIVAR SOM</button>
            
            <table class="prog-table">
                <tbody id="progBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="adminPanel">
    <h2>Gestor Daniboss TV</h2>
    <input type="text" id="newTitle" class="admin-input" placeholder="Título do Vídeo">
    <input type="text" id="newUrl" class="admin-input" placeholder="URL (YouTube ou .m3u8)">
    <div style="display:flex; gap: 10px;">
        <input type="number" id="newStart" class="admin-input" placeholder="Início (seg)">
        <input type="number" id="newEnd" class="admin-input" placeholder="Fim (seg)">
    </div>
    <button onclick="addVideo()" style="width:100%; padding: 10px; background: #22c55e; border: none; color: white; font-weight: bold; cursor:pointer;">+ ADICIONAR À PLAYLIST</button>
    
    <div class="video-list" id="adminVideoList"></div>
    <button class="btn-close" onclick="toggleAdmin()">FECHAR GESTOR (ESC)</button>
</div>

<div class="admin-trigger" onclick="toggleAdmin()">ADMIN MODE (Pressione A)</div>

<script>
// PLAYLIST INICIAL (Caso o localStorage esteja vazio)
const DEFAULT_PLAYLIST = [
    { url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', title: 'Sinal de Teste', start: 0, end: 300 },
    { url: 'https://www.youtube.com/watch?v=KSNUugQuweY', title: 'Exemplo YouTube', start: 10, end: 60 }
];

let playlist = JSON.parse(localStorage.getItem('daniboss_playlist')) || DEFAULT_PLAYLIST;
let ultimoIndice = -1;
let audioAtivado = false;

function savePlaylist() {
    localStorage.setItem('daniboss_playlist', JSON.stringify(playlist));
    renderAdminList();
    renderProgTable();
}

function addVideo() {
    const title = document.getElementById('newTitle').value;
    const url = document.getElementById('newUrl').value;
    const start = parseInt(document.getElementById('newStart').value) || 0;
    const end = parseInt(document.getElementById('newEnd').value) || 300;

    if(title && url) {
        playlist.push({ title, url, start, end });
        savePlaylist();
        alert("Vídeo adicionado!");
    }
}

function removeVideo(index) {
    playlist.splice(index, 1);
    savePlaylist();
}

function toggleAdmin() {
    const panel = document.getElementById('adminPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    renderAdminList();
}

function renderAdminList() {
    const list = document.getElementById('adminVideoList');
    list.innerHTML = playlist.map((v, i) => `
        <div class="video-item">
            <span>${v.title} (${v.end - v.start}s)</span>
            <span class="btn-del" onclick="removeVideo(${i})">REMOVER</span>
        </div>
    `).join('');
}

function renderProgTable() {
    const progBody = document.getElementById('progBody');
    progBody.innerHTML = playlist.map((v, i) => `
        <tr id="prog-${i}">
            <td style="padding:10px; border-top:1px solid #222;">${i+1}. ${v.title}</td>
        </tr>
    `).join('');
}

function enableAudio() {
    audioAtivado = true;
    document.getElementById('player').muted = false;
    document.getElementById('soundBtn').style.display = 'none';
    ultimoIndice = -1; // Força recarregamento com som
    updateLiveStream();
}

function updateLiveStream() {
    if (playlist.length === 0) return;

    const agora = Math.floor(Date.now() / 1000);
    
    // Cálculo de tempos variáveis
    let tempoTotalCiclo = 0;
    playlist.forEach(v => tempoTotalCiclo += (v.end - v.start));
    
    let resto = agora % tempoTotalCiclo;
    let acumulado = 0;
    let indiceAtual = 0;
    let segundoNoVideoRelativo = 0;

    for (let i = 0; i < playlist.length; i++) {
        let duracao = playlist[i].end - playlist[i].start;
        if (resto < acumulado + duracao) {
            indiceAtual = i;
            segundoNoVideoRelativo = playlist[i].start + (resto - acumulado);
            break;
        }
        acumulado += duracao;
    }

    // Atualiza UI
    document.querySelectorAll('.prog-table tr').forEach(r => r.classList.remove('active-row'));
    if(document.getElementById(`prog-${indiceAtual}`)) {
        document.getElementById(`prog-${indiceAtual}`).classList.add('active-row');
    }

    if (indiceAtual !== ultimoIndice) {
        ultimoIndice = indiceAtual;
        const video = playlist[indiceAtual];
        const isYT = video.url.includes('youtube') || video.url.includes('youtu.be');
        
        document.getElementById('info').innerText = `[EM DIRETO] ${video.title}`;

        if (isYT) {
            const id = video.url.match(/(?:v=|be\/)([A-Za-z0-9_-]{11})/)[1];
            document.getElementById('frame').src = `https://www.youtube.com/embed/${id}?autoplay=1&controls=0&mute=${audioAtivado?0:1}&start=${segundoNoVideoRelativo}`;
            document.getElementById('frame').style.display = 'block';
            document.getElementById('player').style.display = 'none';
            document.getElementById('player').pause();
        } else {
            // Lógica para HLS/MP4 (similar à anterior)
            const p = document.getElementById('player');
            document.getElementById('frame').style.display = 'none';
            p.style.display = 'block';
            p.src = video.url;
            p.currentTime = segundoNoVideoRelativo;
            p.play().catch(() => {});
        }
    }
}

// Atalho de teclado: tecla 'A' abre admin
document.addEventListener('keydown', (e) => {
    if(e.key.toLowerCase() === 'a') toggleAdmin();
    if(e.key === 'Escape') document.getElementById('adminPanel').style.display = 'none';
});

setInterval(updateLiveStream, 2000);
window.onload = () => { renderProgTable(); updateLiveStream(); };
</script>
</body>
</html>
