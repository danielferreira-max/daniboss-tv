<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Player com Playlist Editável + Shuffle</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 1300px;
    margin: 20px auto;
    padding: 0 20px;
    background: #0a0a0a;
    color: #e5e5e5;
  }
  
  h2 { margin: 0 0 8px 0; color: #fff; display: flex; align-items: center; gap: 12px; }
  .badge { font-size: 12px; background: #2e2e2e; padding: 4px 12px; border-radius: 20px; font-weight: normal; }
  
  .player-container {
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    position: relative; /* Fundamental para a marca d'água */
  }
  #stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  
  /* ================== ESTILO DA MARCA D'ÁGUA (MOSCA) ================== */
  .watermark {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 100; /* Garante que fique por cima do vídeo/iframe */
    opacity: 0.6; /* Semi-transparente estilo TV */
    pointer-events: none; /* Não interfere nos cliques do player */
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .watermark img {
    height: 35px; /* Tamanho da logo na tela */
    filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
  }
  .live-dot {
    width: 10px; height: 10px;
    background: red; border-radius: 50%;
    box-shadow: 0 0 8px red;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 0% {opacity:1;} 50% {opacity:0.2;} 100% {opacity:1;} }
  /* ===================================================================== */
  
  #player, #frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  #player { object-fit: contain; }
  #frame { display: none; }
  
  #info {
    margin: 12px 0; padding: 10px 16px;
    background: #1a1a1a; border-radius: 10px;
    font-size: 13px; color: #aaa; font-family: monospace;
    border-left: 3px solid #3b82f6;
  }
  
  .controls { margin: 15px 0; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button { padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s ease; }
  button.primary { background: #3b82f6; color: white; }
  button.primary:hover { background: #2563eb; transform: scale(1.02); }
  button.secondary { background: #374151; color: #e5e5e5; }
  button.secondary:hover { background: #4b5563; }
  
  label.toggle { display: inline-flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  
  .table-wrapper { max-height: 400px; overflow-y: auto; border-radius: 12px; border: 1px solid #2a2a2a; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #111; }
  th, td { border: 1px solid #2a2a2a; padding: 8px 6px; }
  td input { width: 100%; border: 1px solid #3a3a3a; border-radius: 6px; background: #1a1a1a; color: #eee; }
  
  tr.active { background: #1e3a5f; animation: pulse 2s infinite; }
  @keyframes pulse { 0% {opacity:1;} 50% {opacity:0.8;} 100% {opacity:1;} }
  
  .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .status-playing { background: #22c55e; box-shadow: 0 0 5px #22c55e; }
  .status-paused { background: #6b7280; }
</style>
</head>
<body>

<h2>🎬 Daniboss TV <span class="badge">YouTube · MP4 · HLS</span></h2>

<div class="player-container">
  <div id="stage">
    <div class="watermark">
      <div class="live-dot"></div>
      <img src="daniboss-tv-logo.png" alt="Daniboss TV Logo">
    </div>

    <video id="player" controls playsinline></video>
    <iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<div id="info"><span class="status-dot status-paused"></span> Pronto — clique ▶ Iniciar</div>

<div class="controls">
  <button id="playBtn" class="primary">▶ Iniciar</button>
  <button id="prevBtn" class="secondary">⏮ Anterior</button>
  <button id="nextBtn" class="secondary">⏭ Próximo</button>
  <label class="toggle"><input type="checkbox" id="shuffleBtn"> 🔀 Shuffle</label>
</div>

<div class="table-wrapper">
  <table id="playlistTable">
    <thead><tr><th style="width:40px">#</th><th>URL</th><th>Tipo</th><th>Início</th><th>Fim</th><th>Nota</th><th>✕</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<div style="margin-top:10px; display:flex; gap:10px; justify-content: flex-end;">
  <button id="addRowBtn" class="secondary">➕ Nova Linha</button>
  <button id="saveBtn" class="primary">💾 Salvar & Reiniciar</button>
</div>

<script>
// ==================== DOM & ESTADO ====================
const player = document.getElementById('player');
const frame = document.getElementById('frame');
const playBtn = document.getElementById('playBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const infoDiv = document.getElementById('info');
const tbody = document.querySelector('#playlistTable tbody');

let videos = [], order = [], currentPos = 0, activeHls = null, frameTimeout = null, isPlaying = false;

// ==================== PLAYLIST ORIGINAL ====================
const INITIAL_PLAYLIST = [
  ['https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'hls', '5', '20', 'demo HLS'],
  ['https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 'mp4', '', '', 'demo MP4'],
  ['https://www.youtube.com/watch?v=KSNUugQuweY', 'auto', '', '', 'YouTube'],
  ['https://www.youtube.com/watch?v=w-15vFFBnCc', 'auto', '', '', 'YouTube'],
  ['https://www.youtube.com/shorts/eiB1zk97wNk', 'auto', '', '60', 'Short'],
];

// ==================== UTILS ====================
function setInfo(msg, isErr=false) {
  infoDiv.innerHTML = `<span class="status-dot ${isPlaying ? 'status-playing' : 'status-paused'}"></span> ${isErr ? '⚠️ ' : ''}${msg}`;
  infoDiv.style.borderLeftColor = isErr ? '#ef4444' : '#3b82f6';
}
function detectType(url) {
  if (!url) return 'mp4'; const u = url.split('?')[0].toLowerCase();
  if (u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
  if (u.endsWith('.m3u8')) return 'hls'; return 'mp4';
}
function getYouTubeId(url) { const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/); return match ? match[1] : null; }

// ==================== PLAYBACK CORE ====================
function clearPlayback() {
  if (frameTimeout) clearTimeout(frameTimeout);
  if (activeHls) { activeHls.destroy(); activeHls = null; }
  player.pause(); player.removeAttribute('src'); player.load();
  frame.src = 'about:blank'; frame.style.display = 'none'; player.style.display = 'block';
}

function buildOrder() {
  order = videos.map((_, i) => i);
  if (shuffleBtn.checked) order.sort(() => Math.random() - 0.5);
  currentPos = 0;
}

async function playCurrent() {
  if (!videos.length) { setInfo('Playlist vazia!', true); return; }
  clearPlayback();
  const currentIdx = order[currentPos];
  const video = videos[currentIdx];
  const type = video.type === 'auto' ? detectType(video.url) : video.type;

  // Highlight na tabela
  document.querySelectorAll('tr.active').forEach(r=>r.classList.remove('active'));
  tbody.children[currentIdx].classList.add('active');

  try {
    if (type === 'youtube') {
      const id = getYouTubeId(video.url);
      if (!id) throw new Error('ID YT inválido');
      const params = new URLSearchParams({ autoplay: '1', rel: '0', playsinline: '1' });
      if (video.start) params.set('start', video.start);
      if (video.end) params.set('end', video.end);
      frame.src = `https://www.youtube.com/embed/${id}?${params}`;
      frame.style.display = 'block'; player.style.display = 'none';
      setInfo(`Daniboss TV > YouTube: ${video.note || id}`);
      // Timer simples para pular (YT embed não avisa fim nativamente sem API complexa)
      let dur = 300; if (video.end) dur = video.end - (video.start||0);
      frameTimeout = setTimeout(() => nextVideo(), dur * 1000 + 3000);
    } else if (type === 'hls' && Hls.isSupported()) {
      activeHls = new Hls(); activeHls.loadSource(video.url); activeHls.attachMedia(player);
      activeHls.on(Hls.Events.MANIFEST_PARSED, () => { if (video.start) player.currentTime = video.start; player.play(); });
      setInfo(`Daniboss TV > HLS: ${video.note}`);
    } else { // mp4 nativo
      player.src = video.url; player.load();
      player.addEventListener('loadedmetadata', () => { if (video.start) player.currentTime = video.start; player.play(); }, {once:true});
      setInfo(`Daniboss TV > MP4: ${video.note}`);
    }
    isPlaying = true; playBtn.textContent = '⏸ Pausar';
  } catch (e) { setInfo(`Erro: ${e.message}`, true); setTimeout(()=>nextVideo(), 3000); }
}

function nextVideo() { if (!videos.length) return; currentPos = (currentPos + 1) % order.length; playCurrent(); }
function prevVideo() { if (!videos.length) return; currentPos = (currentPos - 1 + order.length) % order.length; playCurrent(); }

player.addEventListener('timeupdate', () => {
  const video = videos[order[currentPos]];
  if (video.end && player.currentTime >= video.end) { player.pause(); nextVideo(); }
});
player.addEventListener('ended', nextVideo);

// ==================== GESTÃO DA TABELA ====================
function renderRow(v, i) {
  return `<tr>
    <td>${i+1}</td>
    <td><input type="text" value="${v[0]}" placeholder="URL"></td>
    <td><select><option value="auto" ${v[1]=='auto'?'selected':''}>Auto</option><option value="youtube">YT</option><option value="hls">HLS</option><option value="mp4">MP4</option></select></td>
    <td><input type="number" value="${v[2]}" style="width:50px"></td>
    <td><input type="number" value="${v[3]}" style="width:50px"></td>
    <td><input type="text" value="${v[4]}"></td>
    <td><button onclick="this.closest('tr').remove()" style="padding: 2px 6px; background:#dc2626; color:white">✕</button></td>
  </tr>`;
}
function addRow(data=['','auto','','','']) { tbody.insertAdjacentHTML('beforeend', renderRow(data, tbody.children.length)); }
function readTable() {
  videos = [];
  tbody.querySelectorAll('tr').forEach(tr => {
    const inputs = tr.querySelectorAll('input, select');
    const url = inputs[0].value.trim();
    if (url) videos.push({ url, type: inputs[1].value, start: Number(inputs[2].value), end: Number(inputs[3].value), note: inputs[4].value });
  });
}

// ==================== EVENTOS ====================
playBtn.addEventListener('click', () => { if (player.paused && player.src) { player.play(); isPlaying=true; } else if (isPlaying) { player.pause(); isPlaying=false; } else { playCurrent(); } });
document.getElementById('nextBtn').addEventListener('click', nextVideo);
document.getElementById('prevBtn').addEventListener('click', prevVideo);
document.getElementById('addRowBtn').addEventListener('click', () => addRow());
document.getElementById('saveBtn').addEventListener('click', () => { readTable(); buildOrder(); playCurrent(); });
shuffleBtn.addEventListener('change', () => { buildOrder(); playCurrent(); });

// ==================== INIT ====================
INITIAL_PLAYLIST.forEach(v => addRow(v));
readTable();
buildOrder();
setInfo(`Daniboss TV pronta com ${videos.length} vídeos. Clique ▶ Iniciar.`);

</script>
</body>
</html>
