<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DANIBOSS TV - LIVE SYNC</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0; padding: 0;
    background: #050505; color: #e5e5e5;
    display: flex; flex-direction: column; height: 100vh;
  }

  /* LAYOUT PRINCIPAL */
  .main-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ÁREA DO PLAYER (LADO ESQUERDO) */
  .player-section {
    flex: 3; /* Ocupa 75% da largura */
    position: relative;
    background: #000;
    display: flex; flex-direction: column;
  }

  /* ÁREA DO CHAT (LADO DIREITO) */
  .chat-section {
    flex: 1; /* Ocupa 25% da largura */
    background: #111;
    border-left: 1px solid #222;
    display: flex;
    flex-direction: column;
    min-width: 300px;
  }

  .chat-header {
    padding: 15px;
    background: #1a1a1a;
    font-weight: bold;
    border-bottom: 1px solid #333;
    text-align: center;
    color: #3b82f6;
  }

  .chat-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    color: #555;
    font-size: 14px;
  }

  /* PLAYER E MARCA D'ÁGUA */
  #stage { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
  .watermark {
    position: absolute; top: 20px; right: 20px;
    z-index: 1000; opacity: 0.7; pointer-events: none;
    display: flex; align-items: center; gap: 10px;
  }
  .watermark img { height: 40px; }
  .live-dot {
    width: 10px; height: 10px; background: red; border-radius: 50%;
    box-shadow: 0 0 8px red; animation: blink 1.2s infinite;
  }
  @keyframes blink { 0% {opacity:1;} 50% {opacity:0.2;} 100% {opacity:1;} }

  #player, #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* UI E INFOS */
  .ui-footer { padding: 15px; background: #0a0a0a; border-top: 1px solid #222; }
  #info { font-family: monospace; color: #22c55e; font-size: 13px; }

  @media (max-width: 900px) {
    .main-layout { flex-direction: column; }
    .chat-section { min-width: 100%; height: 300px; }
  }
</style>
</head>
<body>

<div class="main-layout">
  <div class="player-section">
    <div id="stage">
      <div class="watermark">
        <div class="live-dot"></div>
        <img src="daniboss-tv-logo.png" alt="DANIBOSS TV">
      </div>
      <video id="player" playsinline muted></video>
      <iframe id="frame" allow="autoplay; encrypted-media;"></iframe>
    </div>
    
    <div class="ui-footer">
      <div id="info">Sincronizando com a emissão global...</div>
      <button onclick="unmute()" id="soundBtn" style="margin-top:10px; padding:8px; cursor:pointer; background:#3b82f6; border:0; color:#fff; border-radius:4px;">
        🔊 ATIVAR SOM
      </button>
    </div>
  </div>

  <div class="chat-section">
    <div class="chat-header">CHAT AO VIVO</div>
    
    <div class="chat-placeholder" id="chatContainer">
      <div>
        <p>O Chat da Daniboss TV será ativado em breve.</p>
        <small>Para testar agora, você pode inserir um widget do Cbox.ws aqui.</small>
      </div>
      </div>
  </div>
</div>

<script>
const player = document.getElementById('player');
const frame = document.getElementById('frame');
const info = document.getElementById('info');

const DURACAO_BLOCO = 300; // Cada vídeo ocupa 5 minutos na grade de programação
const DATA = [
  ['https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'Abertura'],
  ['https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 'Curta Metragem'],
  ['https://www.youtube.com/watch?v=KSNUugQuweY', 'Clipe 1'],
  ['https://www.youtube.com/watch?v=w-15vFFBnCc', 'Clipe 2'],
  ['https://www.youtube.com/watch?v=ed2cwHEQIDM', 'TSMC Tech'],
  ['https://www.youtube.com/watch?v=6X4c4Q8gY4o', 'Estratégias'],
  ['https://www.youtube.com/watch?v=8D_5xY4QJ0A', 'Dicas Negociar']
];

function unmute() {
    player.muted = false;
    document.getElementById('soundBtn').style.display = 'none';
    info.innerText = "Sincronizado e com áudio!";
}

function syncStream() {
    const agora = Math.floor(Date.now() / 1000);
    const tempoTotal = DATA.length * DURACAO_BLOCO;
    const resto = agora % tempoTotal;
    
    const indice = Math.floor(resto / DURACAO_BLOCO);
    const segundoNoVideo = resto % DURACAO_BLOCO;
    
    const videoUrl = DATA[indice][0];
    const videoNome = DATA[indice][1];
    const isYT = videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be');

    info.innerText = `[LIVE] Passando agora: ${videoNome} (Sincronizado)`;

    if (isYT) {
        const id = videoUrl.match(/(?:v=|shorts\/|be\/)([A-Za-z0-9_-]{11})/)[1];
        frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&controls=0&mute=1&start=${segundoNoVideo}`;
        frame.style.display = 'block'; player.style.display = 'none';
    } else {
        frame.style.display = 'none'; player.style.display = 'block';
        if (videoUrl.includes('.m3u8')) {
            if (Hls.isSupported()) {
                const hls = new Hls(); hls.loadSource(videoUrl); hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { player.currentTime = segundoNoVideo; player.play(); });
            }
        } else {
            player.src = videoUrl;
            player.onloadedmetadata = () => { player.currentTime = segundoNoVideo; player.play(); };
        }
    }

    // Agenda a próxima troca de vídeo exatamente no fim do bloco de 5min
    const delay = (DURACAO_BLOCO - segundoNoVideo) * 1000;
    setTimeout(syncStream, delay);
}

window.onload = syncStream;
</script>
</body>
</html>
