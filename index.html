<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Daniboss TV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  max-width: 1300px;
  margin: 20px auto;
  padding: 0 20px;
  background: #0a0a0a;
  color: #e5e5e5;
}

h2 {
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
}

.badge {
  font-size: 12px;
  background: #2e2e2e;
  padding: 4px 12px;
  border-radius: 20px;
}

.player-container {
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 20px;
}

#stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}

#player,
#frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#player {
  object-fit: contain;
}

#frame {
  border: 0;
  display: none;
}

/* WATERMARK */
.watermark {
  position: absolute;
  top: 14px;
  right: 18px;
  z-index: 2147483647;
  background: rgba(0,0,0,0.45);
  color: white;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  pointer-events: none;
  transition: all 0.2s ease;
}

.watermark span {
  color: #3b82f6;
}

/* FULLSCREEN */
:fullscreen .watermark,
:-webkit-full-screen .watermark,
:-moz-full-screen .watermark,
:-ms-fullscreen .watermark {
  position: fixed;
  top: 20px;
  right: 24px;
  z-index: 2147483647;
  font-size: 18px;
  padding: 10px 18px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
}

#info {
  margin: 12px 0;
  padding: 10px 16px;
  background: #1a1a1a;
  border-radius: 10px;
  font-size: 13px;
  color: #aaa;
  font-family: monospace;
  border-left: 3px solid #3b82f6;
}

.controls {
  margin: 15px 0;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

button {
  padding: 8px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
}

button.primary {
  background: #3b82f6;
  color: white;
}

button.secondary {
  background: #374151;
  color: #e5e5e5;
}

label.toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #1a1a1a;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

.warn {
  background: #2d2a1a;
  border-left: 4px solid #eab308;
  padding: 10px 16px;
  font-size: 12px;
  margin: 16px 0;
  border-radius: 8px;
  color: #ccc;
}

.playlist-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 24px 0 12px 0;
  flex-wrap: wrap;
  gap: 12px;
}

.hint {
  font-size: 12px;
  color: #888;
}

.table-wrapper {
  max-height: 450px;
  overflow-y: auto;
  border-radius: 12px;
  border: 1px solid #2a2a2a;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  background: #111;
}

th,
td {
  border: 1px solid #2a2a2a;
  padding: 8px 6px;
}

th {
  background: #1e1e1e;
  position: sticky;
  top: 0;
  z-index: 10;
}

td input,
td select {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid #3a3a3a;
  border-radius: 6px;
  background: #1a1a1a;
  color: #e5e5e5;
  font-size: 12px;
}

td.url input {
  font-family: monospace;
  font-size: 11px;
}

td.num {
  width: 85px;
}

td.type {
  width: 100px;
}

td.actions {
  width: 55px;
  text-align: center;
}

.row-btn {
  background: #dc2626;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 6px;
  color: white;
}

tr.active {
  background: #1e3a5f;
}

tr.active td {
  border-color: #3b82f6;
}

.status-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 8px;
}

.status-playing {
  background: #22c55e;
  box-shadow: 0 0 5px #22c55e;
}

.status-paused {
  background: #6b7280;
}
</style>
</head>

<body>

<h2>
  🎬 Daniboss TV
  <span class="badge">Canal TV · Firebase · Shuffle · Autoplay</span>
</h2>

<div class="player-container">
  <div id="stage">

    <video
      id="player"
      controls
      playsinline
      autoplay
      muted>
    </video>

    <iframe
      id="frame"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>

    <div class="watermark">
      DANIBOSS <span>TV</span>
    </div>

  </div>
</div>

<div id="info">
  <span class="status-dot status-paused"></span>
  A carregar...
</div>

<div class="controls">
  <button id="playBtn" class="primary">▶ Iniciar</button>
  <button id="prevBtn" class="secondary">⏮ Anterior</button>
  <button id="nextBtn" class="secondary">⏭ Próximo</button>
  <button id="fullscreenBtn" class="secondary">⛶ Fullscreen</button>

  <label class="toggle">
    <input type="checkbox" id="shuffleBtn" checked>
    🔀 Shuffle
  </label>
</div>

<div class="warn">
  <strong>📌 Notas:</strong>
  Instagram/Reels não permite autoplay real.
  O player avança automaticamente para o próximo vídeo.
</div>

<div class="playlist-header">
  <h3>📋 Playlist editável</h3>

  <div>
    <button id="addRowBtn" class="secondary">➕ Nova Linha</button>
    <button id="saveBtn" class="primary">💾 Salvar & Reiniciar</button>
  </div>
</div>

<p class="hint">
  💡 Para Instagram/Reels usa Fim = 10 ou 15 segundos.
</p>

<div class="table-wrapper">
  <table id="playlistTable">
    <thead>
      <tr>
        <th style="width:40px">#</th>
        <th>URL</th>
        <th style="width:100px">Tipo</th>
        <th style="width:80px">Início</th>
        <th style="width:80px">Fim</th>
        <th>Nota</th>
        <th style="width:50px"></th>
      </tr>
    </thead>

    <tbody></tbody>
  </table>
</div>

<script>
/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "AIzaSyANZgI5dhvLAvnKd3DgXMnDqI9CF2rBZEA",
  authDomain: "daniboss-tv.firebaseapp.com",
  projectId: "daniboss-tv",
  storageBucket: "daniboss-tv.firebasestorage.app",
  messagingSenderId: "541103479451",
  appId: "1:541103479451:web:b20c574257045f8186843e"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

const PLAYLIST_DOC =
  db.collection('playlists').doc('principal');

/* ================= DOM ================= */

const player = document.getElementById('player');
const frame = document.getElementById('frame');

const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const saveBtn = document.getElementById('saveBtn');
const addRowBtn = document.getElementById('addRowBtn');

const shuffleBtn =
  document.getElementById('shuffleBtn');

const fullscreenBtn =
  document.getElementById('fullscreenBtn');

const tbody =
  document.querySelector('#playlistTable tbody');

const infoDiv =
  document.getElementById('info');

/* ================= ESTADO ================= */

let videos = [];
let order = [];
let currentPos = 0;

let activeHls = null;
let frameTimeout = null;
let watchdogTimer = null;

let isPlaying = false;

/* ================= INFO ================= */

function setInfo(msg, isError = false) {

  infoDiv.innerHTML = `
    <span class="status-dot ${
      isPlaying
        ? 'status-playing'
        : 'status-paused'
    }"></span>

    ${isError ? '⚠️ ' : ''}${msg}
  `;

  infoDiv.style.borderLeftColor =
    isError
      ? '#ef4444'
      : '#3b82f6';
}

/* ================= AUTH ================= */

async function iniciarAuth() {

  if (!auth.currentUser) {
    await auth.signInAnonymously();
  }
}

/* ================= PLAYLIST ================= */

async function carregarPlaylist() {

  try {

    await iniciarAuth();

    const doc =
      await PLAYLIST_DOC.get();

    if (!doc.exists) {
      renderPlaylist([]);
      return;
    }

    const data = doc.data();

    renderPlaylist(data.videos || []);

    videos = readTable();

    buildOrder();

    setInfo(
      `✅ Playlist carregada: ${videos.length} vídeos`
    );

  } catch (e) {

    console.error(e);

    setInfo(
      `Erro Firebase: ${e.message}`,
      true
    );
  }
}

async function salvarPlaylist() {

  try {

    await iniciarAuth();

    const lista = readTable();

    await PLAYLIST_DOC.set({
      videos: lista,
      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()
    });

    setInfo(
      `💾 Playlist salva: ${lista.length} vídeos`
    );

    videos = lista;

    buildOrder();

  } catch (e) {

    console.error(e);

    setInfo(
      `Erro ao salvar: ${e.message}`,
      true
    );
  }
}

function ouvirPlaylist() {

  PLAYLIST_DOC.onSnapshot(snapshot => {

    if (!snapshot.exists) return;

    const data = snapshot.data();

    if (!Array.isArray(data.videos)) return;

    renderPlaylist(data.videos);

    videos = readTable();

    buildOrder();

  });
}

/* ================= TABLE ================= */

function renderPlaylist(lista) {

  tbody.innerHTML = '';

  lista.forEach(v => {

    addRow([
      v.url || '',
      v.type || 'auto',
      v.start ?? '',
      v.end ?? '',
      v.note || ''
    ]);
  });
}

function addRow(data = ['', 'auto', '', '', '']) {

  const tr =
    document.createElement('tr');

  tr.innerHTML = `
    <td>${tbody.children.length + 1}</td>

    <td class="url">
      <input type="text" value="${data[0]}">
    </td>

    <td class="type">
      <select>
        <option value="auto">auto</option>
        <option value="youtube">youtube</option>
        <option value="instagram">instagram</option>
        <option value="hls">hls</option>
        <option value="mp4">mp4</option>
      </select>
    </td>

    <td class="num">
      <input type="number" value="${data[2]}">
    </td>

    <td class="num">
      <input type="number" value="${data[3]}">
    </td>

    <td>
      <input type="text" value="${data[4]}">
    </td>

    <td class="actions">
      <button class="row-btn">✕</button>
    </td>
  `;

  tr.querySelector('select').value =
    data[1] || 'auto';

  tr.querySelector('.row-btn')
    .addEventListener('click', () => {

      tr.remove();

      reindexTable();
    });

  tbody.appendChild(tr);
}

function reindexTable() {

  tbody.querySelectorAll('tr')
    .forEach((row, i) => {

      row.cells[0].textContent = i + 1;
    });
}

function readTable() {

  const arr = [];

  tbody.querySelectorAll('tr')
    .forEach(row => {

      const inputs =
        row.querySelectorAll('input, select');

      const url =
        inputs[0].value.trim();

      if (!url) return;

      arr.push({
        url,
        type: inputs[1].value,
        start:
          inputs[2].value === ''
            ? null
            : Number(inputs[2].value),
        end:
          inputs[3].value === ''
            ? null
            : Number(inputs[3].value),
        note:
          inputs[4].value.trim()
      });
    });

  return arr;
}

/* ================= PLAYER ================= */

function detectType(url) {

  const u = url.toLowerCase();

  if (
    u.includes('youtube.com') ||
    u.includes('youtu.be')
  ) return 'youtube';

  if (
    u.includes('instagram.com')
  ) return 'instagram';

  if (
    u.includes('.m3u8')
  ) return 'hls';

  return 'mp4';
}

function getYouTubeId(url) {

  const patterns = [

    /youtube\.com\/watch\?.*v=([A-Za-z0-9_-]{11})/,

    /youtu\.be\/([A-Za-z0-9_-]{11})/,

    /youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/
  ];

  for (const p of patterns) {

    const m = url.match(p);

    if (m) return m[1];
  }

  return null;
}

function getInstagramPath(url) {

  const m =
    url.match(
      /instagram\.com\/(reel|reels|p)\/([^\/?#]+)/i
    );

  if (!m) return null;

  return `reel/${m[2]}`;
}

function clearPlayback() {

  stopWatchdog();

  if (frameTimeout) {
    clearTimeout(frameTimeout);
    frameTimeout = null;
  }

  if (activeHls) {

    try {
      activeHls.destroy();
    } catch(e){}

    activeHls = null;
  }

  try {

    player.pause();

    player.removeAttribute('src');

    player.load();

  } catch(e){}

  frame.src = 'about:blank';

  frame.style.display = 'none';

  player.style.display = 'block';
}

function buildOrder() {

  order =
    videos.map((_, i) => i);

  if (shuffleBtn.checked) {

    for (
      let i = order.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [order[i], order[j]] =
        [order[j], order[i]];
    }
  }

  currentPos = 0;
}

function highlightCurrentRow() {

  document.querySelectorAll(
    '#playlistTable tbody tr'
  ).forEach(tr => {

    tr.classList.remove('active');
  });

  const rows =
    document.querySelectorAll(
      '#playlistTable tbody tr'
    );

  if (rows[order[currentPos]]) {

    rows[order[currentPos]]
      .classList.add('active');
  }
}

function stopWatchdog() {

  if (watchdogTimer) {

    clearInterval(watchdogTimer);

    watchdogTimer = null;
  }
}

function startWatchdog() {

  stopWatchdog();

  let last =
    player.currentTime;

  let stalled = 0;

  watchdogTimer = setInterval(() => {

    if (frame.style.display === 'block')
      return;

    if (!isPlaying)
      return;

    const current =
      player.currentTime;

    if (
      Math.abs(current - last) < 0.1
    ) {
      stalled++;
    } else {
      stalled = 0;
    }

    last = current;

    if (stalled >= 5) {

      setInfo(
        'Vídeo parado — próximo...',
        true
      );

      nextVideo();
    }

  }, 1000);
}

async function safePlayVideo() {

  player.muted = true;
  player.autoplay = true;
  player.playsInline = true;

  try {

    await player.play();

    isPlaying = true;

  } catch(e) {

    setInfo(
      'Autoplay bloqueado',
      true
    );
  }
}

async function loadHLSVideo(url) {

  return new Promise((resolve, reject) => {

    if (!window.Hls) {

      reject(
        new Error('HLS.js não carregado')
      );

      return;
    }

    activeHls = new Hls();

    activeHls.loadSource(url);

    activeHls.attachMedia(player);

    activeHls.on(
      Hls.Events.MANIFEST_PARSED,
      () => resolve()
    );

    activeHls.on(
      Hls.Events.ERROR,
      (e, data) => {

        if (data.fatal) {

          reject(
            new Error(data.details)
          );
        }
      }
    );
  });
}

async function playCurrent() {

  if (!videos.length) return;

  if (
    currentPos >= order.length
  ) {
    currentPos = 0;
  }

  const video =
    videos[order[currentPos]];

  const type =
    video.type === 'auto'
      ? detectType(video.url)
      : video.type;

  clearPlayback();

  highlightCurrentRow();

  try {

    /* ================= YOUTUBE ================= */

    if (type === 'youtube') {

      const id =
        getYouTubeId(video.url);

      if (!id)
        throw new Error(
          'YouTube inválido'
        );

      const params =
        new URLSearchParams({

          autoplay: '1',
          mute: '1',
          rel: '0',
          playsinline: '1'
        });

      if (video.start)
        params.set('start', video.start);

      if (video.end)
        params.set('end', video.end);

      frame.src =
        `https://www.youtube.com/embed/${id}?${params}`;

      frame.style.display = 'block';

      player.style.display = 'none';

      isPlaying = true;

      setInfo(
        `▶️ YouTube: ${video.note || id}`
      );

      let duration = 300;

      if (
        video.end &&
        video.start
      ) {
        duration =
          video.end - video.start;
      }
      else if (video.end) {
        duration = video.end;
      }

      frameTimeout =
        setTimeout(
          nextVideo,
          duration * 1000
        );
    }

    /* ================= INSTAGRAM ================= */

    else if (type === 'instagram') {

      const instaPath =
        getInstagramPath(video.url);

      if (!instaPath)
        throw new Error(
          'Instagram inválido'
        );

      frame.src =
        `https://www.instagram.com/${instaPath}/embed`;

      frame.style.display = 'block';

      player.style.display = 'none';

      isPlaying = true;

      setInfo(
        `📸 Instagram: ${
          video.note || instaPath
        }`
      );

      let duration = 10;

      if (
        video.end &&
        video.start
      ) {
        duration =
          video.end - video.start;
      }
      else if (video.end) {
        duration = video.end;
      }

      frameTimeout =
        setTimeout(() => {

          setInfo(
            '📸 Instagram não permite autoplay — próximo...'
          );

          nextVideo();

        }, duration * 1000);
    }

    /* ================= HLS ================= */

    else if (type === 'hls') {

      await loadHLSVideo(video.url);

      await safePlayVideo();

      startWatchdog();

      setInfo(
        `🎥 HLS: ${video.note || video.url}`
      );
    }

    /* ================= MP4 ================= */

    else {

      player.src = video.url;

      await new Promise((resolve, reject) => {

        player.addEventListener(
          'loadedmetadata',
          resolve,
          { once: true }
        );

        player.addEventListener(
          'error',
          () => reject(
            new Error('Erro MP4')
          ),
          { once: true }
        );
      });

      await safePlayVideo();

      startWatchdog();

      setInfo(
        `🎬 MP4: ${video.note || video.url}`
      );
    }

  } catch(e) {

    console.error(e);

    setInfo(
      `Erro: ${e.message}`,
      true
    );

    setTimeout(
      nextVideo,
      2000
    );
  }
}

function nextVideo() {

  if (!order.length) return;

  currentPos =
    (currentPos + 1)
      % order.length;

  playCurrent();
}

function prevVideo() {

  if (!order.length) return;

  currentPos =
    (currentPos - 1 + order.length)
      % order.length;

  playCurrent();
}

/* ================= FULLSCREEN ================= */

fullscreenBtn.addEventListener(
  'click',
  toggleFullscreen
);

function toggleFullscreen() {

  const stage =
    document.getElementById('stage');

  if (
    !document.fullscreenElement
  ) {

    if (stage.requestFullscreen) {
      stage.requestFullscreen();
    }

  } else {

    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

document.addEventListener(
  'fullscreenchange',
  ajustarWatermark
);

function ajustarWatermark() {

  const watermark =
    document.querySelector('.watermark');

  watermark.style.display =
    'block';
}

/* ================= EVENTS ================= */

playBtn.addEventListener(
  'click',
  playCurrent
);

nextBtn.addEventListener(
  'click',
  nextVideo
);

prevBtn.addEventListener(
  'click',
  prevVideo
);

saveBtn.addEventListener(
  'click',
  salvarPlaylist
);

addRowBtn.addEventListener(
  'click',
  () => addRow()
);

player.addEventListener(
  'ended',
  nextVideo
);

player.addEventListener(
  'error',
  nextVideo
);

player.addEventListener(
  'stalled',
  nextVideo
);

/* ================= INIT ================= */

carregarPlaylist()
  .then(() => {

    ouvirPlaylist();

    setTimeout(() => {

      videos = readTable();

      buildOrder();

      playCurrent();

    }, 1000);
  });
</script>

</body>
</html>
