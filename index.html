<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DANIBOSS TV - LIVE SYNC</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0; padding: 0;
    background: #050505; color: #e5e5e5;
    display: flex; flex-direction: column; height: 100vh;
    overflow: hidden;
  }

  /* ESTRUTURA PRINCIPAL */
  .main-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* PLAYER (ESQUERDA) */
  .player-section {
    flex: 3;
    position: relative;
    background: #000;
    display: flex;
    flex-direction: column;
  }

  /* CHAT (DIREITA) */
  .chat-section {
    flex: 1;
    background: #0f0f0f;
    border-left: 1px solid #222;
    display: flex;
    flex-direction: column;
    min-width: 320px;
  }

  .chat-header {
    padding: 15px;
    background: #1a1a1a;
    font-weight: bold;
    border-bottom: 1px solid #333;
    text-align: center;
    color: #3b82f6;
    letter-spacing: 1px;
  }

  .chat-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
    color: #444;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ÁREA DO VÍDEO */
  #stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }

  /* MARCA D'ÁGUA */
  .watermark {
    position: absolute;
    top: 25px; right: 25px;
    z-index: 1000;
    opacity: 0.7;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .watermark img { height: 45px; filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.8)); }
  .live-dot {
    width: 10px; height: 10px; background: #ff0000;
    border-radius: 50%; box-shadow: 0 0 10px #ff0000;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0% {opacity:1;} 50% {opacity:0.2;} 100% {opacity:1;} }

  #player, #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* RODAPÉ E BOTÕES */
  .ui-footer {
    padding: 20px;
    background: #0a0a0a;
    border-top: 1px solid #222;
  }
  #info {
    font-family: 'Courier New', Courier, monospace;
    color: #22c55e;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .btn-sound {
    padding: 10px 20px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-sound:hover { background: #1d4ed8; }

  @media (max-width: 1000px) {
    .main-layout { flex-direction: column; overflow-y: auto; }
    .chat-section { min-width: 100%; height: 400px; }
  }
</style>
</head>
<body>

<div class="main-layout">
  <div class="player-section">
    <div id="stage">
      <div class="watermark">
        <div class="live-dot"></div>
        <img src="daniboss-tv-logo.png" alt="DANIBOSS TV">
      </div>
      
      <video id="player" playsinline muted></video>
      <iframe id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>
    
    <div class="ui-footer">
      <div id="info">A ligar aos servidores da Daniboss TV...</div>
      <button class="btn-sound" id="soundBtn" onclick="enableAudio()">🔊 ATIVAR SOM DO CANAL</button>
    </div>
  </div>

  <div class="chat-section">
    <div class="chat-header">CHAT EM DIRETO</div>
    <div class="chat-placeholder" id="chatContainer">
      <div>
        <p><b>Bem-vindo à Daniboss TV!</b></p>
        <p>O chat será ativado brevemente.<br>Conecta-te com outros espetadores em tempo real.</p>
      </div>
    </div>
  </div>
</div>

<script>
const player = document.getElementById('player');
const frame = document.getElementById('frame');
const info = document.getElementById('info');
const soundBtn = document.getElementById('soundBtn');

const DURACAO_BLOCO = 300; // 5 minutos por cada vídeo na grelha

// LISTA DE VÍDEOS PRESERVADA
const DATA = [
  ['https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'Sinal de Teste HLS'],
  ['https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 'Curta Metragem'],
  ['https://www.youtube.com/watch?v=KSNUugQuweY', 'Clipe Musical'],
  ['https://www.youtube.com/watch?v=w-15vFFBnCc', 'Ação YT'],
  ['https://www.youtube.com/watch?v=ed2cwHEQIDM', 'TSMC Q1 2026'],
  ['https://www.youtube.com/watch?v=6X4c4Q8gY4o', '33 Estratégias'],
  ['https://www.youtube.com/watch?v=8D_5xY4QJ0A', '5 Dicas Negociar'],
  ['https://www.youtube.com/watch?v=8f6S8LZg8U4', 'Psicologia'],
  ['https://www.youtube.com/watch?v=2R6yP8x2dJg', 'Técnicas Persuasão'],
  ['https://www.youtube.com/watch?v=6gG2ZZU6H5U', 'Conflitos'],
  ['https://www.youtube.com/watch?v=2q1Y0Vg6z4c', 'Decisão'],
  ['https://www.youtube.com/watch?v=Q2D1l6yF3mA', 'Gestão']
];

let ultimoIndice = -1;
let audioAtivado = false;

function enableAudio() {
    player.muted = false;
    audioAtivado = true;
    soundBtn.style.display = 'none';
    info.innerText = "Transmissão em Direto - Áudio Ativado";
}

function updateLiveStream() {
    const agora = Math.floor(Date.now() / 1000);
    const tempoTotal = DATA.length * DURACAO_BLOCO;
    const resto = agora % tempoTotal;
    
    const indiceAtual = Math.floor(resto / DURACAO_BLOCO);
    const segundoNoVideo = resto % DURACAO_BLOCO;

    // Só atualiza se mudar o vídeo para não interromper o que está a dar
    if (indiceAtual !== ultimoIndice) {
        ultimoIndice = indiceAtual;
        const url = DATA[indiceAtual][0];
        const nome = DATA[indiceAtual][1];
        const isYT = url.includes('youtube.com') || url.includes('youtu.be');

        info.innerText = `[EMISSÃO] A passar: ${nome}`;

        if (isYT) {
            const id = url.match(/(?:v=|shorts\/|be\/)([A-Za-z0-9_-]{11})/)[1];
            // Start sincronizado + Loop para preencher os 5min caso o vídeo seja curto
            frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&controls=0&mute=${audioAtivado ? 0 : 1}&start=${segundoNoVideo}&playlist=${id}&loop=1`;
            frame.style.display = 'block';
            player.style.display = 'none';
            player.pause();
        } else {
            frame.style.display = 'none';
            frame.src = "about:blank";
            player.style.display = 'block';
            
            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(player);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        player.currentTime = segundoNoVideo;
                        player.play().catch(e => console.log("Autoplay blocked"));
                    });
                }
            } else {
                player.src = url;
                player.onloadedmetadata = () => {
                    player.currentTime = segundoNoVideo;
                    player.play().catch(e => console.log("Autoplay blocked"));
                };
            }
        }
    }
}

// MOTOR DE SINCRONIZAÇÃO (Verifica a cada 2 segundos)
setInterval(updateLiveStream, 2000);

// Início imediato
window.onload = updateLiveStream;

</script>
</body>
</html>
